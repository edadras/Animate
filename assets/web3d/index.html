<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Rahino 3D World</title>
  <link rel="stylesheet" href="styles.css" />
  <!--
    Three.js (r161) + addons are bundled locally under js/vendor/ so the game
    runs fully OFFLINE — no CDN required. The engine still degrades gracefully
    and reports status to Flutter over the bridge if 3D fails to start.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "./js/vendor/three.module.js",
      "three/addons/": "./js/vendor/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- In-canvas world-space labels (landmark names, Rahino speech, prompts).
       The premium HUD itself is drawn natively by Flutter ON TOP of this view. -->
  <div id="overlay">
    <div id="rahino-bubble" class="hidden"></div>
    <div id="world-labels"></div>
    <div id="interact-hint" class="hidden"><b>✋</b> <span></span></div>
    <div id="photo-frame" class="hidden">
      <span class="c tl"></span><span class="c tr"></span>
      <span class="c bl"></span><span class="c br"></span>
    </div>
  </div>

  <!-- On-screen touch joystick + buttons live in Flutter; the engine also
       supports keyboard for desktop testing in a browser. -->
  <div id="engine-status">Booting 3D engine…</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
